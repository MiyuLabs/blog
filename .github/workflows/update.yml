name: Trigger Website Deploy

on:
  workflow_dispatch: # Trigger manually only

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger MiyuLabs/www Deploy Workflow
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/MiyuLabs/www/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main", "inputs": {"purge_scope": "blog"}}'
